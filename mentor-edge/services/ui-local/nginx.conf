server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/config/ {
        set $upstream http://edge-config-service:8004;
        rewrite ^/api/config/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/resiliencia/ {
        set $upstream http://resiliencia:8002;
        rewrite ^/api/resiliencia/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/detector/ {
        rewrite ^/api/detector/(.*)$ /$1 break;
        proxy_pass http://${DETECTOR_HOST_IP}:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # WebSocket stream de cámara — conexión persistente, upgrade WS
    location = /api/detector/ws/stream {
        rewrite ^/api/detector/(.*)$ /$1 break;
        proxy_pass http://${DETECTOR_HOST_IP}:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/enviador/ {
        set $upstream http://enviador:8003;
        rewrite ^/api/enviador/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # SSE events stream: sin buffering, timeout largo para conexiones persistentes
    location = /api/gateway/edge/stream {
        set $upstream http://edge-gateway:8005;
        rewrite ^/api/gateway/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
    }

    # MJPEG stream: enruta siempre al edge-gateway.
    # El gateway intenta primero yolo-counter (:8006) si está corriendo;
    # si no está disponible abre el stream RTSP con ffmpeg directamente.
    # Así funciona con o sin yolo-counter instalado.
    location = /api/gateway/edge/camera/stream {
        set $upstream http://edge-gateway:8005;
        rewrite ^/api/gateway/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control no-cache;
    }

    location /api/gateway/ {
        set $upstream http://edge-gateway:8005;
        rewrite ^/api/gateway/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
    }

    location = /api/env-file {
        proxy_pass http://127.0.0.1:9090;
    }
}
