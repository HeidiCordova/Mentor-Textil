# Mosquitto MQTT Broker — MentorCloud
# Escucha en 1883 (sin TLS) para bridge edge→cloud
# Para TLS activar el listener 8883 y copiar certificados

listener 1883 0.0.0.0
protocol mqtt

# Autenticación por usuario/contraseña
# Generar: docker exec mentor-mqtt-broker mosquitto_passwd -b /mosquitto/config/passwd <user> <pass>
# Si no existe el archivo de passwords, allow_anonymous=true como fallback temporal.
allow_anonymous true

# Persistencia de mensajes
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_type error
log_type warning
log_type notice

# Límites
max_connections 100
max_queued_messages 5000
