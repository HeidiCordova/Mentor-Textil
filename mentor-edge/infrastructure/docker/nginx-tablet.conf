server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver de Docker para re-resolver DNS dinámicamente (evita 502 al reiniciar el gateway)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Stream MJPEG — conexión nueva por request para evitar que nginx reutilice
    # el keepalive después de que el stream termina (causa "invalid chunked response")
    location = /edge/camera/stream {
        set $upstream http://edge-gateway:8005;
        proxy_pass         $upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header   Connection "close";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        gzip               off;
    }

    location /edge/ {
        set $upstream http://edge-gateway:8005;
        proxy_pass         $upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        # Gzip debe estar desactivado para SSE y streaming — si no, nginx
        # intenta bufferar para comprimir y corta el chunked encoding
        gzip               off;
    }

    location /vision/ {
        rewrite ^/vision/(.*)$ /$1 break;
        proxy_pass         http://172.18.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 5s;
    }

    # WebSocket stream de cámara — conexión persistente, upgrade WS
    location = /vision/ws/stream {
        rewrite ^/vision/(.*)$ /$1 break;
        proxy_pass         http://172.18.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # index.html nunca se cachea → el browser siempre verifica si cambió
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Assets con hash en el nombre → se pueden cachear indefinidamente
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
