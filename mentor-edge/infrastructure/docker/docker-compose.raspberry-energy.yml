# Stack Raspberry Pi — Lectura de medidores MEATROL MC60 via Modbus RTU
# Servicios: postgres (buffer local) + mc60-reader (lectura Modbus) + energy-sender (envio al cloud)
#
# Prerequisito: cargar imágenes ARM64 con load-images.sh antes del primer arranque.
#
# Uso:
#   cp .env.rpi .env          # ajustar DEVICE_ID y MODBUS_SERIAL_DEV
#   sh load-images.sh         # solo la primera vez
#   docker compose --env-file .env up -d

services:

  postgres:
    image: postgres:15-alpine
    container_name: rpi-energy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       mentor_energy
      POSTGRES_USER:     mentor
      POSTGRES_PASSWORD: mentor
      TZ: ${TZ:-America/Lima}
      PGTZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/26_energy_local.sql:/docker-entrypoint-initdb.d/01_energy.sql:ro
      - ./database/27_energy_meters.sql:/docker-entrypoint-initdb.d/02_meters.sql:ro
      - ./database/28_energy_meter_index.sql:/docker-entrypoint-initdb.d/03_index.sql:ro
      - ./database/29_energy_config_audit.sql:/docker-entrypoint-initdb.d/04_audit.sql:ro
    ports:
      - "5432:5432"
    networks:
      mentor_net:
        ipv4_address: 172.30.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentor -d mentor_energy"]
      interval: 10s
      timeout: 3s
      retries: 5

  mc60-reader:
    image: mentor-mc60-reader:latest
    container_name: rpi-mc60-reader
    restart: unless-stopped
    group_add:
      - "20"  # dialout — acceso al puerto serie RS-485
    environment:
      TZ:                     ${TZ:-America/Lima}
      POSTGRES_URL:           postgresql://mentor:mentor@172.30.0.2:5432/mentor_energy
      DEVICE_ID:              ${DEVICE_ID:-rpienergy01}
      MODBUS_SERIAL_DEV:      ${MODBUS_SERIAL_DEV:-/dev/ttyUSB0}
      METER_POLL_INTERVAL_MS: ${METER_POLL_INTERVAL_MS:-300000}
      # Medidores conectados al bus RS-485 (hasta 5).
      # METER_ID_N = identificador logico; METER_UNIT_ID_N = Modbus Unit ID (1-247).
      # Dejar METER_ID_N vacio para deshabilitar ese slot.
      METER_ID_1:      ${METER_ID_1:-}
      METER_UNIT_ID_1: ${METER_UNIT_ID_1:-1}
      METER_ID_2:      ${METER_ID_2:-}
      METER_UNIT_ID_2: ${METER_UNIT_ID_2:-2}
      METER_ID_3:      ${METER_ID_3:-}
      METER_UNIT_ID_3: ${METER_UNIT_ID_3:-3}
      METER_ID_4:      ${METER_ID_4:-}
      METER_UNIT_ID_4: ${METER_UNIT_ID_4:-4}
      METER_ID_5:      ${METER_ID_5:-}
      METER_UNIT_ID_5: ${METER_UNIT_ID_5:-5}
    devices:
      - "${MODBUS_SERIAL_DEV:-/dev/ttyUSB0}:${MODBUS_SERIAL_DEV:-/dev/ttyUSB0}"
    networks:
      mentor_net:
        ipv4_address: 172.30.0.3
    depends_on:
      postgres:
        condition: service_healthy

  energy-sender:
    image: mentor-energy-sender:arm64
    container_name: rpi-energy-sender
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./resolv.conf:/etc/resolv.conf:ro
    environment:
      # Config operacional (api_key, cloud_url, intervalos) vive en energy.config (DB).
      # Modificar: UPDATE energy.config SET value='...' WHERE key='...';
      # Recargar:  curl -X POST http://localhost:8086/config/reload
      POSTGRES_URL: postgresql://mentor:mentor@172.30.0.2:5432/mentor_energy
      PORT:         "8086"
      TZ:           ${TZ:-America/Lima}
    networks:
      mentor_net:
        ipv4_address: 172.30.0.4
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  ui-energy:
    image: mentor-ui-energy:arm64
    container_name: rpi-ui-energy
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Lima}
    networks:
      mentor_net:
        ipv4_address: 172.30.0.5
    depends_on:
      energy-sender:
        condition: service_started
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8087/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  mentor_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
