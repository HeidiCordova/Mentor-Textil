name: docker

services:

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mentor_edge
      POSTGRES_USER: mentor
      POSTGRES_PASSWORD: mentor
      TZ: ${TZ:-America/Lima}
      PGTZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/02_seed.sh:/docker-entrypoint-initdb.d/02_seed.sh:ro
      # Migraciones idempotentes (IF NOT EXISTS / ON CONFLICT) — solo se aplican
      # en instalaciones nuevas (cuando el volumen pgdata está vacío).
      # Para Jetsons existentes: ejecutar manualmente con psql.
      - ../database/05_fix_stop_type_constraint.sql:/docker-entrypoint-initdb.d/03_fix_stop_type.sql:ro
      - ../database/05_production_runs.sql:/docker-entrypoint-initdb.d/04_production_runs.sql:ro
      - ../database/06_prod_runs_constraints.sql:/docker-entrypoint-initdb.d/05_prod_runs_idx.sql:ro
      - ../database/09_vision_detections.sql:/docker-entrypoint-initdb.d/06_vision_detections.sql:ro
      - ../database/30_detector_calibration.sql:/docker-entrypoint-initdb.d/07_detector_calibration.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentor -d mentor_edge"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  vision-event-detector:
    build:
      context: ../../services/vision-event-detector
      dockerfile: Dockerfile
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      CONFIG_SERVICE_URL: http://127.0.0.1:8004
      RESILIENCIA_URL: http://127.0.0.1:8002
      GATEWAY_URL: http://127.0.0.1:8005
      LINEA_ID: ${LINEA_ID:-1}
      DEVICE_ID: ${DEVICE_ID:-jetson-1}
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: mentor_edge
      PGUSER: mentor
      PGPASSWORD: mentor
      CALIBRATION_SAMPLES: ${CALIBRATION_SAMPLES:-30}
      CALIBRATION_MIN_QUALITY: ${CALIBRATION_MIN_QUALITY:-0.90}
      CALIBRATION_EXPIRY_DAYS: ${CALIBRATION_EXPIRY_DAYS:-90}
      EVENT_SPOOL_PATH: /var/lib/mentor/vision-events.sqlite3
      OEE_STATE_FILE: /var/lib/mentor/last_oee_emit
      EVENT_SPOOL_MAX_EVENTS: ${EVENT_SPOOL_MAX_EVENTS:-10000}
      EVENT_SPOOL_MAX_EVENT_BYTES: ${EVENT_SPOOL_MAX_EVENT_BYTES:-65536}
      EVENT_RETRY_INITIAL_S: ${EVENT_RETRY_INITIAL_S:-1}
      EVENT_RETRY_MAX_S: ${EVENT_RETRY_MAX_S:-60}
      EVENT_RETRY_MAX_ATTEMPTS: ${EVENT_RETRY_MAX_ATTEMPTS:-0}
      EVENT_HTTP_TIMEOUT_S: ${EVENT_HTTP_TIMEOUT_S:-5}
      TZ: ${TZ:-America/Lima}
    volumes:
      - vision_event_spool:/var/lib/mentor
    depends_on:
      postgres:
        condition: service_healthy
      edge-config-service:
        condition: service_healthy
      resiliencia:
        condition: service_healthy
    # devices: solo necesario para cámaras USB locales (/dev/videoX)
    # Con RTSP no se necesita — comentado para evitar error si no hay cámara USB
    # devices:
    #   - "/dev/video0:/dev/video0"
    #   - "/dev/video1:/dev/video1"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  resiliencia:
    build:
      context: ../../services/resiliencia
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: mentor
      DB_PASSWORD: mentor
      DB_NAME: mentor_edge
      PORT: "8002"
      TZ: ${TZ:-America/Lima}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 128M

  enviador:
    build:
      context: ../../services/enviador
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: mentor
      DB_PASSWORD: mentor
      DB_NAME: mentor_edge
      HEALTH_PORT: "8003"
      TZ: ${TZ:-America/Lima}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 128M

  edge-config-service:
    build:
      context: ../../services/edge-config-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: mentor
      DB_PASSWORD: mentor
      DB_NAME: mentor_edge
      PORT: "8004"
      TZ: ${TZ:-America/Lima}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8004:8004"
    deploy:
      resources:
        limits:
          memory: 128M

  edge-gateway:
    build:
      context: ../../services/edge-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: mentor
      DB_PASSWORD: mentor
      DB_NAME: mentor_edge
      PORT: "8005"
      AUTH_TOKEN: ${EDGE_AUTH_TOKEN:-}
      CONFIG_SERVICE_URL: http://edge-config-service:8004
      RESILIENCIA_URL: http://resiliencia:8002
      DETECTOR_URL: http://host.docker.internal:8001
      ENVIADOR_URL: http://enviador:8003
      CLOUD_URL: ${CLOUD_URL:-https://mentormonitor-ai.com}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-1a6972ea4616461a44296edd5a1e5b1d438457594c5e5458df82c36c06033279}
      TZ: ${TZ:-America/Lima}
    volumes:
      # sysfs del host (read-only) — necesario para métricas GPU, thermal, devfreq
      - /sys/devices:/sys/devices:ro
      - /sys/class:/sys/class:ro
      # SQL template para provisioning de líneas
      - ../database/linea_template.sql:/app/linea_template.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      resiliencia:
        condition: service_healthy
      edge-config-service:
        condition: service_healthy
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8005/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  ui-local:
    build:
      context: ../../services/ui-local
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ./:/env-data
    depends_on:
      - resiliencia
      - edge-config-service
    deploy:
      resources:
        limits:
          memory: 64M

  tablet-app:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ${TABLET_DIST_PATH:-/home/orin/mentor-apps/mentor-tablet-app/dist}:/usr/share/nginx/html:ro
      - ./nginx-tablet.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          memory: 32M

volumes:
  pgdata:
    driver: local
  vision_event_spool:
    driver: local
