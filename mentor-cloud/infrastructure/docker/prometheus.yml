global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: cloud

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - target_label: instance
        replacement: cloud-server

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: cloud-ingest
    static_configs:
      - targets: ['cloud-ingest:8082']
    metrics_path: /metrics
